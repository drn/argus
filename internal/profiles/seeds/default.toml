# default diligence profile
#
# Balanced model allocation across all 13 archetypes: premium models up the tree
# (plan / orchestrate / review / synthesize) where leverage is high and output is
# hard to verify, cheaper models down the tree (CI loops, verification, docs)
# where work is high-volume and verifiable. Archetypes below treat Fable as
# absent (pulled from market at the time this profile's archetype allocation
# was written), so per-archetype models use the current line-up only — the
# reviewer panel below is unrelated and DOES use Fable now that it's back
# (D9, add-cross-vendor-review): Fable+Opus is the strongest panel that can
# actually be run today.
#
# This is a documented EXAMPLE, embedded in the argus binary as an install seed
# (internal/profiles/seeds.go). Install it via the Settings > Hera > "Install
# Default Profiles" action, `argus profiles install-defaults`, or by hand:
# copy it to ~/.argus/profiles/default.toml (or a project's
# .argus/profiles/default.toml) and adapt. Never auto-installed on daemon
# startup — installation is always an explicit action. Validate with:
# argus validate default

[archetype.brainstorm]
models = { claude = "opus", codex = "gpt-6-astra" }
effort = "high"

[archetype.orchestrator]
models = { claude = "sonnet", codex = "gpt-6-sol" }

[archetype.big_build]
models = { claude = "sonnet", codex = "gpt-6-sol" }

[archetype.code_slice]
models = { claude = "sonnet", codex = "gpt-6-sol" }

[archetype.bug_fix]
models = { claude = "sonnet", codex = "gpt-6-sol" }

[archetype.review]
models = { claude = "opus", codex = "gpt-6-astra" }

[archetype.security_review]
models = { claude = "opus", codex = "gpt-6-astra" }

[archetype.synthesis]
models = { claude = "sonnet", codex = "gpt-6-sol" }

[archetype.spec_audit]
models = { claude = "sonnet", codex = "gpt-6-sol" }

[archetype.ci_loop]
models = { claude = "haiku", codex = "gpt-6-sol" }

[archetype.verify]
models = { claude = "haiku", codex = "gpt-6-sol" }

[archetype.recovery]
models = { claude = "sonnet", codex = "gpt-6-sol" }

[archetype.docs]
models = { claude = "haiku", codex = "gpt-6-sol" }

[rigor]
review_passes       = 1
gating              = false
security_spot_check = false

# Reviewer panel (grammar owned by internal/review — see D7 in
# add-cross-vendor-review/design.md). Middle rigor: both broad in-session
# finders, no corrective lens, no fix-verification phase (customer_grade turns
# both on; lean drops to a single finder). codex is a RESERVED, valid finder id
# per the grammar but is NOT listed here — cross-vendor composition is
# deferred until the foreign-reviewer-capture primitive lands (D-SCOPE).
#
# GOTCHA (D7): a "fable" finder means Fable:LOW — it silently falls back to
# Opus at medium/high effort. See customer_grade.toml for the full note.
[panel]
finders = ["opus", "fable"]
